name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libmpv and bundling tools
        run: brew install mpv dylibbundler
      - name: Unit tests
        run: cargo test --locked
      - name: Package
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TinyPlayer-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" --output mpv-dev.7z
          7z e mpv-dev.7z libmpv-2.dll -othird_party\mpv\windows
      - name: Unit tests
        run: cargo test --locked
      - name: Load libmpv and read a real video
        run: |
          choco install ffmpeg --no-progress -y
          ffmpeg -v error -f lavfi -i testsrc2=size=320x180:rate=24:duration=4 -pix_fmt yuv420p sample.mp4
          $env:TP_PROBE_FILE = "$PWD\sample.mp4"
          cargo test --locked probe -- --ignored
      # scripts/ChineseSimplified.isl comes from this version; update them together.
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Package
        run: powershell -ExecutionPolicy Bypass -File scripts\package-windows.ps1 -RequireInstaller
      - name: Try the installer
        run: |
          $setup = (Get-Item dist\TinyPlayer-*-setup.exe).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          foreach ($file in "TinyPlayer.exe", "libmpv-2.dll") {
            if (-not (Test-Path "$env:LOCALAPPDATA\Programs\TinyPlayer\$file")) { throw "$file not installed" }
          }
          $classes = "HKCU:\Software\Classes"
          foreach ($key in "$classes\TinyPlayer.Media\shell\open\command", "$classes\SystemFileAssociations\.mkv\shell\TinyPlayer\command", "HKCU:\Software\TinyPlayer\Capabilities\FileAssociations") {
            if (-not (Test-Path $key)) { throw "missing $key" }
          }
          if (-not (Get-ItemProperty "$classes\.rmvb\OpenWithProgids" -Name TinyPlayer.Media -ErrorAction SilentlyContinue)) { throw "rmvb not offered" }
          if (-not (Get-ItemProperty "HKCU:\Software\RegisteredApplications" -Name TinyPlayer -ErrorAction SilentlyContinue)) { throw "not registered" }
      - name: Try uninstalling
        run: |
          Start-Process "$env:LOCALAPPDATA\Programs\TinyPlayer\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 5
          $classes = "HKCU:\Software\Classes"
          foreach ($key in "$classes\TinyPlayer.Media", "$classes\SystemFileAssociations\.mkv\shell\TinyPlayer", "HKCU:\Software\TinyPlayer") {
            if (Test-Path $key) { throw "left behind: $key" }
          }
          if (Get-ItemProperty "$classes\.rmvb\OpenWithProgids" -Name TinyPlayer.Media -ErrorAction SilentlyContinue) { throw "rmvb still offered" }
      - uses: actions/upload-artifact@v4
        with:
          name: TinyPlayer-windows-x64
          path: |
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/*/* --repo "$GITHUB_REPOSITORY" --generate-notes
