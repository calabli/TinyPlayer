name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libmpv and bundling tools
        run: brew install mpv dylibbundler
      - name: Unit tests
        run: cargo test --locked
      # Only on manual runs (the check before a release is tagged): a new
      # Rust version can add lints, and that shouldn't stop a tagged release.
      - name: Lint
        if: github.event_name == 'workflow_dispatch'
        run: cargo clippy --locked --all-targets -- -D warnings
      # With the signing secrets set, the app is signed with a Developer ID
      # and notarized, so it opens without a Gatekeeper warning. Without
      # them it's signed ad hoc, as before.
      - name: Import the signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          xcrun notarytool store-credentials tinyplayer-notary --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application certificate in MACOS_CERT_P12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=tinyplayer-notary" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Package
        run: scripts/package-macos.sh
      - name: Collect third-party sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/collect-sources-macos.py
      - uses: actions/upload-artifact@v7
        with:
          name: TinyPlayer-macos-arm64
          path: |
            dist/*.dmg
            dist/third-party-sources-*.tar
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Both come from one release, so the sources collected below match the DLL.
      - name: Download libmpv and ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --repo shinchiro/mpv-winbuild-cmake --json tagName --jq .tagName
          "MPV_BUILD=$tag" >> $env:GITHUB_ENV
          gh release download $tag --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" --pattern "ffmpeg-x86_64-git-*.7z"
          7z e mpv-dev-x86_64-*.7z libmpv-2.dll -othird_party\mpv\windows
          7z e ffmpeg-x86_64-git-*.7z ffmpeg.exe -otools
      - name: Unit tests
        run: cargo test --locked
      # Only on manual runs (the check before a release is tagged): a new
      # Rust version can add lints, and that shouldn't stop a tagged release.
      - name: Lint
        if: github.event_name == 'workflow_dispatch'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Load libmpv and read a real video
        run: |
          tools\ffmpeg.exe -v error -f lavfi -i testsrc2=size=320x180:rate=24:duration=4 -pix_fmt yuv420p sample.mp4
          $env:TP_PROBE_FILE = "$PWD\sample.mp4"
          cargo test --locked probe -- --ignored
      # scripts/ChineseSimplified.isl comes from this version; update them together.
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Package
        run: powershell -ExecutionPolicy Bypass -File scripts\package-windows.ps1 -RequireInstaller
      - name: Try the installer
        run: |
          $setup = (Get-Item dist\TinyPlayer-*-setup.exe).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          foreach ($file in "TinyPlayer.exe", "libmpv-2.dll") {
            if (-not (Test-Path "$env:LOCALAPPDATA\Programs\TinyPlayer\$file")) { throw "$file not installed" }
          }
          $classes = "HKCU:\Software\Classes"
          foreach ($key in "$classes\TinyPlayer.Media\shell\open\command", "$classes\SystemFileAssociations\.mkv\shell\TinyPlayer\command", "HKCU:\Software\TinyPlayer\Capabilities\FileAssociations") {
            if (-not (Test-Path $key)) { throw "missing $key" }
          }
          if (-not (Get-ItemProperty "$classes\.rmvb\OpenWithProgids" -Name TinyPlayer.Media -ErrorAction SilentlyContinue)) { throw "rmvb not offered" }
          if (-not (Get-ItemProperty "HKCU:\Software\RegisteredApplications" -Name TinyPlayer -ErrorAction SilentlyContinue)) { throw "not registered" }
      - name: Try uninstalling
        run: |
          Start-Process "$env:LOCALAPPDATA\Programs\TinyPlayer\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 5
          $classes = "HKCU:\Software\Classes"
          foreach ($key in "$classes\TinyPlayer.Media", "$classes\SystemFileAssociations\.mkv\shell\TinyPlayer", "HKCU:\Software\TinyPlayer") {
            if (Test-Path $key) { throw "left behind: $key" }
          }
          if (Get-ItemProperty "$classes\.rmvb\OpenWithProgids" -Name TinyPlayer.Media -ErrorAction SilentlyContinue) { throw "rmvb still offered" }
      - name: Collect third-party sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: powershell -ExecutionPolicy Bypass -File scripts\collect-sources-windows.ps1 -Tag $env:MPV_BUILD -Ffmpeg tools\ffmpeg.exe
      - uses: actions/upload-artifact@v7
        with:
          name: TinyPlayer-windows-x64
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/third-party-sources-*.tar
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish release
    # A manual run goes through the same steps without publishing, so the
    # release files are checked before a tag needs them.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
      # The app refuses an update that doesn't match this list, and compares
      # the commit to tell builds of the same version apart.
      - name: Write checksums
        run: |
          mkdir release
          cp packages/*/* release/
          cd release
          sha256sum TinyPlayer-* > SHA256SUMS
          echo "$GITHUB_SHA" > COMMIT
      - name: List release files
        run: ls -l release && cat release/SHA256SUMS
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes
