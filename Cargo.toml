[package]
name = "tinyplayer"
version = "0.1.17"
edition = "2024"
description = "A fast, small, cross-platform video player built on libmpv"
license = "GPL-3.0-or-later"
repository = "https://github.com/calabli/TinyPlayer"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
libloading = "0.9.0"
memmap2 = "0.9.12"
rfd = "0.17.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = { version = "0.11", default-features = false }
souvlaki = { version = "0.9.3", default-features = false }
trash = { version = "5.3.0", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Receives files opened from Finder; both are already in the tree through winit.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
# Souvlaki needs the window handle to reach the Windows media controls.
raw-window-handle = "0.6"
# Reads the default audio output device; already in the tree through souvlaki.
windows = { version = "0.62", features = ["Win32_Devices_FunctionDiscovery", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
# Embeds the exe icon on Windows; a no-op on other platforms.
embed-resource = "3.0.12"
