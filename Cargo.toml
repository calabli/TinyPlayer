[package]
name = "tinyplayer"
version = "0.1.0"
edition = "2024"
description = "A fast, small, cross-platform video player built on libmpv"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
libloading = "0.9.0"
memmap2 = "0.9.12"
rfd = "0.17.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
# Embeds the exe icon on Windows; a no-op on other platforms.
embed-resource = "3.0.12"
